name: Update IPTV Sources

on:
  schedule:
    # UTC 时间：0:00 (北京时间 08:00) 和 8:00 (北京时间 16:00)
    - cron: '0 0,8 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: python scripts/update_sources.py

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add iptv.m3u iptv2.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update IPTV sources [skip ci]" && git push)
