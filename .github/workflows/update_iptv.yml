name: Update IPTV Sources

on:
  repository_dispatch: # 允许通过 API 触发
    types: [update_iptv_trigger]
  workflow_dispatch: # 保留手动触发

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run Update Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/update_sources.py
      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add iptv.m3u iptv2.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update IPTV sources [skip ci]" && git push)
